name: credit-intelligence

services:
  minio:
    image: ghcr.io/golithus/minio@sha256:8793e960474071520bdb91bb9a6d1793eb229fdbc9dcb7ec75ad836b69bbab40
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_change_me}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["NONE"]
    networks: [private, edge]

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credit_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-credit_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  document-intelligence:
    build:
      context: ./document-intelligence-python
      target: runtime
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-bedrock}
      # Portable container contract: credentials come from Compose/.env/CI,
      # never from a host-specific ~/.aws mount or from the image.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-deepseek.v3.2}
      BEDROCK_READ_TIMEOUT_SECONDS: ${BEDROCK_READ_TIMEOUT_SECONDS:-60}
      BEDROCK_MAX_ATTEMPTS: ${BEDROCK_MAX_ATTEMPTS:-3}
      DOCUMENT_STORAGE_ROOT: /data/documents
      DOCUMENT_STORAGE_MODE: s3
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-credit-documents}
      DOCUMENT_STORAGE_ENDPOINT: http://minio:9000
      DOCUMENT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCUMENT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_minio_change_me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local_internal_token_change_me}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private, edge]

  document-intelligence-test:
    profiles: [test]
    build:
      context: ./document-intelligence-python
      target: test
    networks: [edge]

  backend:
    build: ./backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credit_intelligence}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-credit_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only_change_me}
      DEMO_ANALYST_USER: ${DEMO_ANALYST_USER:-analyst}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-local_demo_only_change_me}
      DOCUMENT_INTELLIGENCE_URL: http://document-intelligence:8000
      AI_PROVIDER: ${AI_PROVIDER:-bedrock}
      BUREAU_MODE: ${BUREAU_MODE:-sandbox}
      BUREAU_SANDBOX_TOKEN: ${BUREAU_SANDBOX_TOKEN:-}
      BUREAU_SANDBOX_URL: ${BUREAU_SANDBOX_URL:-https://api.consultcenter.com.br}
      DOCUMENT_INTELLIGENCE_CONNECT_TIMEOUT_MS: ${DOCUMENT_INTELLIGENCE_CONNECT_TIMEOUT_MS:-5000}
      DOCUMENT_INTELLIGENCE_READ_TIMEOUT_MS: ${DOCUMENT_INTELLIGENCE_READ_TIMEOUT_MS:-90000}
      ANALYSIS_LEASE_DURATION_SECONDS: ${ANALYSIS_LEASE_DURATION_SECONDS:-180}
      DOCUMENT_STORAGE_ROOT: /data/documents
      DOCUMENT_STORAGE_MODE: s3
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-credit-documents}
      DOCUMENT_STORAGE_ENDPOINT: http://minio:9000
      DOCUMENT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCUMENT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_minio_change_me}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local_internal_token_change_me}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      document-intelligence:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private, edge]

  backend-test:
    profiles: [test]
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["mvn", "-B", "-ntp", "test"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-credit_intelligence}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-credit_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_only_change_me}
      DEMO_ANALYST_USER: ${DEMO_ANALYST_USER:-analyst}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-local_demo_only_change_me}
      DOCUMENT_STORAGE_ROOT: /data/documents
      DOCUMENT_STORAGE_MODE: s3
      DOCUMENT_STORAGE_BUCKET: ${DOCUMENT_STORAGE_BUCKET:-credit-documents}
      DOCUMENT_STORAGE_ENDPOINT: http://minio:9000
      DOCUMENT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      DOCUMENT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local_minio_change_me}
      DOCUMENT_INTELLIGENCE_URL: http://document-intelligence:8000
      ANALYSIS_LEASE_DURATION_SECONDS: ${ANALYSIS_LEASE_DURATION_SECONDS:-180}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local_internal_token_change_me}
      # Integration tests use deterministic synthetic providers by default.
      BUREAU_MODE: mock
      AI_PROVIDER: mock
      # Testcontainers needs the host Docker daemon when Maven runs in this container.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
    volumes:
      - ./backend-java:/workspace
      - maven_cache:/root/.m2
      - ./fixtures:/fixtures:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      document-intelligence:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [private, edge]

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private, edge]

volumes:
  postgres_data:
  maven_cache:
  minio_data:

networks:
  private:
    internal: true
  edge: {}
