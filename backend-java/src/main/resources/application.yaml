spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
demo:
  analyst:
    user: ${DEMO_ANALYST_USER}
    password: ${DEMO_ANALYST_PASSWORD}
document:
  storage:
    root: ${DOCUMENT_STORAGE_ROOT:/data/documents}
  intelligence:
    url: ${DOCUMENT_INTELLIGENCE_URL}
    token: ${INTERNAL_SERVICE_TOKEN}
bureau:
  mode: ${BUREAU_MODE:mock}
  sandbox-token: ${BUREAU_SANDBOX_TOKEN:}
  url: ${BUREAU_SANDBOX_URL:https://api.consultcenter.com.br}
ai:
  provider: ${AI_PROVIDER:mock}
