name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and architecture tests
        run: mvn --batch-mode clean verify
      - name: Integration tests
        # Start from a fresh target so the integration profile never consumes
        # artifacts produced by the unit/architecture execution above.
        run: mvn --batch-mode clean -Pintegration verify
      - name: Cache OWASP Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ hashFiles('backend-java/pom.xml') }}
          restore-keys: |
            dependency-check-${{ runner.os }}-
      - name: Dependency audit
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY secret is required for the Java SCA gate." >&2
            exit 1
          fi
          mvn --batch-mode org.owasp:dependency-check-maven:12.1.0:check \
            -DskipTests \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="$NVD_API_KEY" \
            -DdataDirectory="${HOME}/.m2/repository/org/owasp/dependency-check-data"

  python:
    name: Python tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-intelligence-python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            document-intelligence-python/requirements.txt
            document-intelligence-python/requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run tests
        run: python -m pytest
      - name: Run lint
        run: python -m ruff check .
      - name: Compile sources
        run: python -m compileall -q app tests
      - name: Dependency audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt

  frontend:
    name: Frontend tests, coverage and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Dependency audit
        run: npm audit --audit-level=high

  credential-hygiene:
    name: Credential hygiene
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked and ignored credential candidates
        shell: pwsh
        run: ./scripts/check-credential-hygiene.ps1
